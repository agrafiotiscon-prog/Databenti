id: H-025
title: Cross-sectional momentum across 26 CME futures - long recent winners, short recent losers, 15% vol target
mechanism: >
  Asness, Moskowitz & Pedersen (2013 JF, "Value and Momentum Everywhere"): within asset classes, futures
  with the highest past 6-12 month returns (skipping the most recent month) outperform those with the
  lowest. Payer: investors who under-react to slow-moving information and hedgers/allocators who trade
  against relative moves (e.g. rebalancing into laggards). Ranking is RELATIVE, so the book is roughly
  market-neutral within each sector and differs from time-series trend (H-022/H-023), which is net long
  or short whole sectors. Published cross-sectional futures momentum Sharpe ~0.3-0.5 gross (1972-2011),
  weaker after 2010; with 2-6 names per sector the cross-section is thin, so the prior is low.
  H-022 (time-series trend, closed) used the same data; overlap is acknowledged and counted in the DSR N.
direction: both
horizon: "weeks to months (daily rebalance; ranks change slowly)"
features: [daily_closes_v0_v1]
fixed:
  universe: as H-022 (data/universe.py, 26 markets, 7 sectors), ohlcv-1d v.0/v.1 2010-06-07..2025-09-30 (development only; holdout spent, D-052)
  score: "portfolio.signals.momentum_score(p, lookback, skip=21) = sum of log chain returns over (t-lookback-21, t-21]; NaN until 80% of the window exists"
  ranking: "portfolio.signals.cross_sectional, frac 1/3 (top third +1, bottom third -1); by_sector = within each data/universe.py sector (sectors with < 3 valid names that day get 0; livestock always flat); global = one ranking across all markets"
  sizing_execution_costs: exactly as H-022 (portfolio/engine.simulate - per-market 15%/sqrt(N) inverse-vol, portfolio scaled to 15% trailing vol capped 2.5x, next-day-close execution, rolls pay both legs, 1 tick + $2.26 per contract side; stress 2 ticks + fees x1.5); $1M for gates, $100k reported
  protocol: walk-forward 36/12/12 months, variant chosen on train net p5 at fees x1.5 (D-023), G1-G12 via scripts/run_portfolio.py --hypothesis H-025; G3 uses the OOS daily t-stat
  g12: each market's signal circularly shifted by an independent random offset (>= 63 days), 300 draws
  target_metric: OOS annualised net return and Sharpe; user target (D-048) Sharpe >= 1.0
space:
  variant: [xsm126_sector, xsm252_sector, xsm126_global, xsm252_global]
trial_budget: 4
registered: 2026-10-04
status: open
