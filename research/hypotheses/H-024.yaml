id: H-024
title: Cross-sectional carry across 26 CME futures - long high-carry, short low-carry markets, 15% vol target
mechanism: >
  Koijen, Moskowitz, Pedersen & Vrugt (2018 JFE, "Carry"): within each asset class, assets whose futures
  basis implies a high expected return if prices do not move (backwardated commodities, high-yield
  currencies, steep bond curves, high-dividend equity indices) outperform low-carry ones. Payer: hedgers
  and borrowers who pay a premium to shift price risk or fund positions (commodity producers hedging,
  carry-trade funding demand, term premium). Ranking is RELATIVE (long the top, short the bottom), so it
  is mostly market-neutral and a different payer from time-series trend (H-022/H-023). Published
  cross-asset carry Sharpe ~0.5-0.8 gross (1983-2012); post-2010 weaker; our 26-market universe with
  2-6 names per sector is small, so the prior is low-moderate. Commodity carry partly reflects
  seasonality (NG, HE, grains) - the smoothed variants damp this.
direction: both
horizon: "weeks to months (daily rebalance; ranks change slowly)"
features: [daily_closes_v0_v1, contract_calendar]
fixed:
  universe: as H-022 (data/universe.py, 26 markets, 7 sectors), ohlcv-1d v.0/v.1 2010-06-07..2025-09-30 (development only; holdout spent, D-052)
  carry: "c_t = log(P_near / P_far) / spacing_years; near/far by expiry order (portfolio/data.py); spacing_years = the root's median gap between consecutive contract expiries (last date each instrument appears in v.0/v.1 = public contract calendar, not prices); NaN if either price is unknown"
  smooth: "for *_smooth variants: 63-day mean of c_t (min 40 observations), known at t"
  ranking: "portfolio.signals.cross_sectional, frac 1/3 (top third +1, bottom third -1); by_sector = within each data/universe.py sector (sectors with < 3 valid names that day get 0; livestock has 2 names so it is always flat in sector variants); global = one ranking across all markets"
  sizing_execution_costs: exactly as H-022 (portfolio/engine.simulate - per-market 15%/sqrt(N) inverse-vol, portfolio scaled to 15% trailing vol capped 2.5x, next-day-close execution, rolls pay both legs, 1 tick + $2.26 per contract side; stress 2 ticks + fees x1.5); $1M for gates, $100k reported
  protocol: walk-forward 36/12/12 months, variant chosen on train net p5 at fees x1.5 (D-023), G1-G12 via scripts/run_portfolio.py --hypothesis H-024; G3 uses the OOS daily t-stat
  g12: each market's signal circularly shifted by an independent random offset (>= 63 days), 300 draws
  target_metric: OOS annualised net return and Sharpe; user target (D-048) Sharpe >= 1.0
space:
  variant: [xsc_sector, xsc_global, xsc_sector_smooth, xsc_global_smooth]
trial_budget: 4
registered: 2026-10-04
status: open
