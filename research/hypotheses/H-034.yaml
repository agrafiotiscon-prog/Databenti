id: H-034
title: Turn of the month in US equity index futures - long from the close before the last trading day to the 1st/3rd trading day of the new month
mechanism: >
  Lakonishok & Smidt (1988 RFS) and McConnell & Xu (2008 FAJ, "Equity returns at the turn of the month") find that
  US equity returns are concentrated in the last trading day of the month and the first three of the next; McConnell
  & Xu show it in 30+ countries and attribute it to month-start cash flows (payroll, pension contributions, fund
  inflows) - a scheduled, price-insensitive buyer. Distinct from H-019 (fading month-end rebalancing) and H-035
  (conditional rebalancing direction). Risk: much of any equity calendar effect has been equity drift here (G12), so
  the placebo (random 4-day windows) decides. Prior: low-moderate.
direction: follow
horizon: "2-4 trading days, monthly"
features: [daily_closes_v0, month_calendar]
fixed:
  window: "long from the close of the trading day BEFORE the last trading day of the month (T-1) to the close of the n_after-th trading day of the next month; month calendar = each contract's own trading dates"
  markets: "es = ES only; eq4 = ES, NQ, RTY (from its 2017 relisting), YM; $1M / (number of markets) notional each, integer contracts >= 1"
  costs: "1 tick + $2.26 per contract per side; roll inside a window pays 2 sides; fees1.5 / stress (2 ticks + fees x1.5) / plus1tick"
  protocol: "research/daily_eval.py via scripts/run_r9.py (walk-forward 36/12/12, choice on train net p5 at fees x1.5, G1-G12); capital $1M; ohlcv-1d 2010-06..2025-09"
  g12: "placebo: same window length and markets anchored on a random trading date >= 6 trading days from any month-end (one per month), 300 draws"
space:
  n_after: [1, 3]
  markets: [es, eq4]
trial_budget: 4
registered: 2026-10-04
status: open
