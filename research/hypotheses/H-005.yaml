id: H-005
title: Turn-of-the-month effect in ES (hold over the month boundary)
mechanism: >
  Equity returns concentrate around the turn of the month (Ariel 1987 JFE; Lakonishok & Smidt
  1988 RFS; McConnell & Xu 2008 FAJ). Mechanism: month-end and month-start cash flows - pension
  and 401(k) contributions, payroll investing, fund rebalancing - create predictable buying
  pressure. Who pays: liquidity providers / sellers into a predictable demand wave, and anyone
  short over the boundary. Prior: moderate, with documented weakening in recent decades.
direction: follow
horizon: "multi-day: long from the cash close of the entry_k-th last trading day of a month to the cash close of trading day exit_day of the next month"
features: [daily_closes]
fixed:
  data: ES ohlcv-1h both ranks 2010-06..2025-09 (cash close = close of the 14:00-15:00 CT bar)
  contract: the entry day's contract (roll rule) for both entry and exit prices
  execution: 1 tick adverse per side + fees (stress 2 ticks + fees x1.5); long only
space:
  entry_k: [1, 2]
  exit_day: [1, 3]
trial_budget: 4
registered: 2026-10-03
status: open
